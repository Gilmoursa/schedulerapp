<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Scheduling Software</title>
</head>

<body>
    <h1>Task Scheduler</h1>

    <form id="people-form">
        <label for="person-name">Name:</label>
        <input type="text" id="person-name" placeholder="e.g. Alice" required>
        <label for="person-availability">Hours available this week:</label>
        <input type="number" id="person-availability" min="1" max="168" value="40">
        <button type="submit">Add person</button>
    </form>

    <div id="people-container">
        <ul id="people-list"></ul>
    </div>

    <form id="task-form">
        <label for="task-name">Task name:</label>
        <input type="text" id="task-name" placeholder="e.g. Write report" required>
        <label for="task-duration">Duration (hours):</label>
        <input type="number" id="task-duration" min="1" max="120" required>
        <button type="submit">Add task</button>
    </form>

    <div id="task-container">
        <ul id="task-list"></ul>
    </div>

    <div id="actions">
        <button id="clear-btn" onclick="clearAll()">Clear all</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
